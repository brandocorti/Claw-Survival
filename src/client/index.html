<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claw Survival</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d0a08;
        overflow: hidden;
      }
      /* The canvas is centered by CSS (not by Phaser), so it stays centered on every resize. */
      #game {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
